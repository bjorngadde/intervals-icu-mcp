# NGINX Home Assistant SSL proxy add-on — customize snippet for the Intervals.icu MCP add-on.
#
# 1. Copy this file to /share/nginx_proxy/intervals.conf (e.g. via the Samba or
#    File editor add-on).
# 2. In the NGINX add-on configuration set:
#      customize:
#        active: true
#        default: nginx_proxy_default*.conf
#        servers: nginx_proxy/*.conf
# 3. Make sure the certificate below covers intervals.gadde.nu, then restart NGINX.
#
# Files in /share/nginx_proxy/ are included inside the http {} block, so this is a
# complete server block of its own, next to the add-on's default one.

# Per-client-IP rate limit (http context, like this whole file). An MCP session is
# bursty (initialize, tools/list, several tool calls, the OAuth redirects), so allow
# a generous burst; sustained guessing of secret paths is capped
# at 10 requests/second per address and answered with 429.
limit_req_zone $binary_remote_addr zone=intervals_mcp:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name intervals.gadde.nu;

    ssl_certificate     /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The secret path and bearer tokens must never land in a log file. Upstream
    # errors are logged at "error" level including the request line, so keep the
    # error log at "crit" here (use the add-on's own logs for debugging).
    access_log off;
    error_log  /dev/stderr crit;

    # MCP messages are small.
    client_max_body_size 2m;

    limit_req        zone=intervals_mcp burst=50 nodelay;
    limit_req_status 429;

    location / {
        # The add-on publishes port 8099 on the host; Home Assistant Core runs on the
        # host network, so this name reaches it from the NGINX container.
        proxy_pass http://homeassistant.local.hass.io:8099;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Streamable HTTP / SSE: stream responses as they are produced and keep
        # long-lived GET streams open.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
    }
}
